<!DOCTYPE html>
<html lang="de" data-theme="light" data-font-size="medium">

<head>
    <!-- Basis Metadaten -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Seitenspezifische Metadaten -->
    <title>404 - Seite nicht gefunden</title>
    <meta name="description" content="404 - Seite nicht gefunden">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/404.css">

    <!-- Header-Komponente wird per jQuery nachgeladen -->
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

    <!-- lädt components/header.html.component in <header> -->
    <script src="js/header-include.js" defer></script>

    <!-- Navigationsverhalten (offnet/schließt Offcanvas, Overlay, Fokus)-->
    <script src="js/nav.js" defer></script>
</head>


<body>
    <!-- Header: enthält die Hauptnavigation, wird nachgeladen -->
    <header class="header" id="site-header"></header>



    <main id="main" class="grid not-found">
        <h1 class="not-found__heading">404</h1>

        <p class="not-found__text">Sorry, diese Seite konnte leider nicht gefunden werden.</p>

        <a class="not-found__link" href="index.html">Zurück zur Startseite</a>

        <div class="not-found__pic">
            <img class="media" src="images/content/404.jpg" alt="Illustration zur 404 Fehlermeldung">
        </div>
    </main>



    <!-- Footer: sekundäre Navigation -->
    <footer id="footer" class="footer">
        <div class="footer__inner">
            <nav aria-label="Seitenende">
                <ul>
                    <li>
                        <a href="impressum.html">Impressum</a>
                    </li>
                    <li>
                        <a href="einstellungen.html">Einstellungen</a>
                    </li>
                </ul>
            </nav>
        </div>
    </footer>

</body>
</html>
