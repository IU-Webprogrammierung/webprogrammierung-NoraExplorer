<!-- 
    Hinweis zur Projektstruktur:
    Die 404-Seite dient aktuell als Platzhalter.
    Erweiterungen erfolgen bewusst erst in der Projektphase 2 & 3. 

    Geplante Funktionen:
    * Klare Fehlermeldungen
    * Link zurück zu den Hauptseiten 
-->

<!DOCTYPE html>
<html lang="de" data-theme="light" data-font-size="medium">

<head>
    <!-- Basis Metadaten -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Seitenspezifische Metadaten -->
    <title>404 - Seite nicht gefunden</title>
    <meta name="description" content="404 - Seite nicht gefunden">

    <!-- 
        Dynamischer Base-Pfad für korrekte relative URLs
        - lokal: "/"
        - GitHub Pages: "/webprogrammierung-NoraExplorer/"
    -->
    <base id="baseHref" href="/">

    <script>
        /* 
            Setzt den Base-Pfad je nach Umgebung; 
            muss im <head> ohne defer laufen, damit alle nachfolgenden relativen Ressourcen (CSS, JS, Bilder, Links) korrekt geladen werden
        */        
        (function () {
            const isGitHubPages = location.hostname.includes("github.io");
            const basePath = isGitHubPages ? "/webprogrammierung-NoraExplorer/" : "/";
            document.getElementById("baseHref").setAttribute("href", basePath);
        })();
    </script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/404.css">

    <!-- Favicon -->
    <link id="favicon" rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any">
    <script src="js/favicon.js" defer></script>

    <!-- Header-Komponente wird per jQuery nachgeladen -->
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

    <!-- lädt components/header.html.component in <header>  & components/footer.html.component in <footer> -->
    <script src="js/layout-include.js" defer></script>

    <!-- Navigationsverhalten (offnet/schließt Offcanvas, Overlay, Fokus)-->
    <script src="js/nav.js" defer></script>

    <!-- User Preferences: Theme, Font, Motion -->
    <script src="js/preferences.js" defer></script>
</head>


<body>
    <!-- Header: enthält die Hauptnavigation, wird nachgeladen -->
    <header class="header" id="site-header"></header>



    <main id="main" class="grid not-found" aria-labelledby="not-found-title">

        <!-- Bild-Card mit "404" Overlay -->
        <div class="not-found__pic">
            <img src="images/content/404.webp" alt="Illustration zur 404 Fehlermeldung">

            <div class="not-found__overlay">
                <h1 class="not-found__heading" id="not-found-title">404</h1>
            </div>
        </div>

        <!-- Kurze Erklärung -->
        <p class="not-found__text">Ups, diese Seite konnte leider nicht gefunden werden.</p>

        <!-- Link zurück zur Startseite -->
        <div class="not-found__link">
            <a class="button button--primary" href="index.html">Zurück zur Startseite</a>
        </div>

    </main>



    <!-- Footer: sekundäre Navigation, wird nachgeladen -->
    <footer id="site-footer" class="footer"></footer>

</body>
</html>
