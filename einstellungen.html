<!-- 
    Hinweis zur Projektstruktur:
    Die Einstellungsseite ist in Phase 1 nur konzeptionell angelegt und bildet die semantische Grundstruktur der geplanten Einstellungen.
    Eine funktionale Umsetzung erfolgt bewusst erst in den Projektphasen 2 & 3

    Geplante Funktionen zur Unterstützung der Barrierefreiheit:
    * Light Mode / Dark Mode / Automatisch
    * Schriftgröße und Textskalierung 
    * Reduzierung von Animationen und Bewegungen
-->

<!DOCTYPE html>
<html lang="de" data-theme="light" data-font-size="medium">

<head>
    <!-- Basis Metadaten -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Seitenspezifische Metadaten -->
    <title>Einstellungen</title>
    <meta name="description" content="Einstellungen - Nora Mikus">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/einstellungen.css">

    <!-- Header-Komponente wird per jQuery nachgeladen -->
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

    <!-- lädt components/header.html.component in <header>  & components/footer.html.component in <footer> -->
    <script src="js/layout-include.js" defer></script>

    <!-- Navigationsverhalten (offnet/schließt Offcanvas, Overlay, Fokus)-->
    <script src="js/nav.js" defer></script>
</head>


<body>
    <!-- Skip-Link, um direkt zum Inhalt oder Footer zu springen -->
    <a href="#main" class="skip-link">Zu den Einstellungen springen</a>
    <a href="#site-footer" class="skip-link">Zum Seitenende springen</a>


    <!-- Header: enthält die Hauptnavigation, wird nachgeladen -->
    <header class="header" id="site-header"></header>



    <!-- Main: Hauptinhalt der Seite -->
    <main id="main" class="grid einstellungen">

        <section class="intro">
            <h1>Einstellungen</h1>

            <p>
                Hier findest du Einstellungen, die es dir ermöglichen, die Website an deine persönlichen Bedürfnisse anzupassen.
            </p>
        </section>


        <!-- Modus -->
        <section class="preference" aria-labelledby="settings-mode">
            <h2 id="settings-mode">Modus</h2>

            <fieldset>
                <legend>Anzeigemodus</legend>

                <input type="radio" name="theme" id="theme-light" value="light">
                <label for="theme-light">Hell</label>

                <input type="radio" name="theme" id="theme-dark" value="dark">
                <label for="theme-dark">Dunkel</label>

                <input type="radio" name="theme" id="theme-auto" value="auto" checked>
                <label for="theme-auto">Automatisch</label>
            </fieldset>
        </section>


        <!-- Schrift & Text -->
        <section class="preference" aria-labelledby="settings-text">
            <h2 id="settings-text">Text</h2>

            <fieldset>
                <legend>Textgröße</legend>

                <input type="radio" name="text-size" id="text-small" value="small">
                <label for="text-small">Klein</label>

                <input type="radio" name="text-size" id="text-medium" value="medium" checked>
                <label for="text-medium">Mittel</label>

                <input type="radio" name="text-size" id="text-large" value="large">
                <label for="text-large">Groß</label>
            </fieldset>
        </section>


        <!-- Bewegung -->
        <section class="preference" aria-labelledby="settings-motion">
            <h2 id="settings-motion">Animationen und Bewegungen</h2>

            <fieldset>
                <legend>Reduziert</legend>

                <label class="switch">
                    <input type="checkbox" id="reduce-motion" name="reduce-motion">
                    <span class="slider" aria-hidden="true"></span>
                    <span class="switch-label">Bewegungen reduzieren</span>
                </label>
            </fieldset>
        </section>
    </main>



    <!-- Footer: sekundäre Navigation, wird nachgeladen -->
    <footer id="site-footer" class="footer"></footer>

</body>
</html>
