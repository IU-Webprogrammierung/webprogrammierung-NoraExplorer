<!-- 
    Einstellungen
    - Light Mode / Dark Mode / Automatisch
    - Schriftgröße und Textskalierung 
    - Reduzierung von Animationen und Bewegungen
-->

<!DOCTYPE html>
<html lang="de" data-theme="light" data-font-size="medium">
<!-- data-theme & data-font-size dienen hier als initial-fallback (preferences.js überschreibt die Werte beim Laden anhand gespeicherter User-Präferenzen/System-Präferenzen) -->

<head>
    <!-- Basis Metadaten -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Seitenspezifische Metadaten -->
    <title>Einstellungen</title>
    <meta name="description" content="Einstellungen - Nora Mikus">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/einstellungen.css">

    <!-- Favicon -->
    <link id="favicon" rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any">
    <script src="js/favicon.js" defer></script>

    <!-- Header-Komponente wird per jQuery nachgeladen -->
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

    <!-- lädt components/header.html.component in <header>  & components/footer.html.component in <footer> -->
    <script src="js/layout-include.js" defer></script>

    <!-- Navigationsverhalten (offnet/schließt Offcanvas, Overlay, Fokus)-->
    <script src="js/nav.js" defer></script>

    <!-- User Preferences: Theme, Font, Motion -->
    <script src="js/preferences.js" defer></script>
</head>


<body>
    <!-- Skip-Link, um direkt zum Inhalt oder Footer zu springen -->
    <a href="#main" class="skip-link">Zu den Einstellungen springen</a>
    <a href="#site-footer" class="skip-link">Zum Seitenende springen</a>


    <!-- Header: enthält die Hauptnavigation, wird nachgeladen -->
    <header class="header" id="site-header"></header>



    <!-- Main: Hauptinhalt der Seite -->
    <main id="main" class="grid einstellungen">

        <!-- Einleitung -->
        <section class="intro">
            <h1>Einstellungen</h1>

            <p>
                Hier findest du Einstellungen, die es dir ermöglichen, die Website an deine persönlichen Bedürfnisse anzupassen.
            </p>
        </section>


        <!-- Modus / Theme -->
        <section class="preference" aria-labelledby="settings-mode">
            <h2 id="settings-mode">Modus</h2>

            <!-- fieldset gruppiert zusammengehörige Radios semantisch korrekt -->
            <fieldset class="tiles">
                <legend>Anzeigemodus</legend>

                <!-- Hell -->
                <input type="radio" name="theme" id="theme-light" value="light">
                <label for="theme-light" class="tile">
                    <span class="tile__icon" aria-hidden="true">
                        <!-- SVG stammt von https://heroicons.com -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                        </svg>
                    </span>
                    <span class="tile__text">Hell</span>
                </label>

                <!-- Dunkel -->
                <input type="radio" name="theme" id="theme-dark" value="dark">
                <label for="theme-dark" class="tile">
                    <span class="tile__icon" aria-hidden="true">
                        <!-- SVG stammt von https://heroicons.com -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                        </svg>
                    </span>
                    <span class="tile__text">Dunkel</span>
                </label>

                <!-- Automatisch -->
                <input type="radio" name="theme" id="theme-auto" value="auto" checked>
                <label for="theme-auto" class="tile">
                    <span class="tile__icon" aria-hidden="true">
                        <!-- SVG stammt von https://heroicons.com -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25" />
                        </svg>
                    </span>
                    <span class="tile__text">Automatisch</span>
                </label>
            </fieldset>
        </section>


        <!-- Schrift & Text -->
        <section class="preference" aria-labelledby="settings-text">
            <h2 id="settings-text">Text</h2>

            <!-- fieldset gruppiert zusammengehörige Radios semantisch korrekt -->
            <fieldset class="tiles">
                <legend>Textgröße</legend>

                <!-- Klein -->
                <input type="radio" name="text-size" id="text-small" value="small">
                <label for="text-small" class="tile">
                    <span class="tile__icon tile__icon--type" aria-hidden="true">
                        <span class="type-preview type-preview--s">ABC</span>
                    </span>
                    <span class="tile__text">Klein</span>
                </label>

                <!-- Mittel -->
                <input type="radio" name="text-size" id="text-medium" value="medium" checked>
                <label for="text-medium" class="tile">
                    <span class="tile__icon tile__icon--type" aria-hidden="true">
                        <span class="type-preview type-preview--m">ABC</span>
                    </span>
                    <span class="tile__text">Mittel</span>
                </label>

                <!-- Groß -->
                <input type="radio" name="text-size" id="text-large" value="large">
                <label for="text-large" class="tile">
                    <span class="tile__icon tile__icon--type" aria-hidden="true">
                        <span class="type-preview type-preview--l">ABC</span>
                    </span>
                    <span class="tile__text">Groß</span>
                </label>
            </fieldset>
        </section>


        <!-- Bewegung -->
        <section class="preference" aria-labelledby="settings-motion">
            <h2 id="settings-motion">Animationen und Bewegungen</h2>

            <fieldset>
                <legend>Reduziert</legend>

                <label class="switch">
                    <input type="checkbox" id="reduce-motion" name="reduce-motion">
                    <span class="slider" aria-hidden="true"></span>
                    <span class="switch-label">Bewegungen reduzieren</span>
                </label>
            </fieldset>
        </section>
    </main>



    <!-- Footer: sekundäre Navigation, wird nachgeladen -->
    <footer id="site-footer" class="footer"></footer>

</body>
</html>
